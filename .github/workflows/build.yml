name: Simulator build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Arithmetic regression checks
        run: swiftc IndicaOS/CalculatorEngine.swift Tests/CalculatorTests.swift -o /tmp/calculator-tests && /tmp/calculator-tests
      - name: Pager physics checks
        run: swiftc IndicaOS/PagerPhysics.swift Tests/PagerPhysicsTests.swift -o /tmp/pager-tests && /tmp/pager-tests
      - name: Calendar and clock checks
        run: swiftc IndicaOS/LocalLogic.swift Tests/LocalLogicTests.swift -o /tmp/local-tests && /tmp/local-tests
      - name: Design token contrast checks
        run: swiftc IndicaOS/InstrumentTokens.swift Tests/InstrumentTokenTests.swift -o /tmp/token-tests && /tmp/token-tests
      - name: Build without signing
        run: xcodebuild -project IndicaOS.xcodeproj -scheme IndicaOS -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
